# Reusable TypeScript CI: lint, typecheck, unit tests, build.
# Scripts come from package.json and are skipped when absent (--if-present).
name: ts-ci

on:
  workflow_call:
    inputs:
      package-manager:
        description: pnpm or npm
        type: string
        default: pnpm
      node-version:
        type: string
        default: "22"
      working-directory:
        type: string
        default: .
      lint-script:
        type: string
        default: lint
      typecheck-script:
        type: string
        default: typecheck
      test-script:
        type: string
        default: test
      build-script:
        type: string
        default: build
      sibling-repos:
        description: >-
          Optional whitespace-separated list of PUBLIC hostryhq repos to check out next to
          the caller so "link:../name" resolves. Format name or name@ref. Default ref is the
          caller's branch if it exists in the sibling, else main. Each sibling is installed
          and built (pnpm install --frozen-lockfile and build) in list order.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # With siblings the caller lives in $GITHUB_WORKSPACE/app, siblings next to it.
        working-directory: ${{ inputs.sibling-repos != '' && format('app/{0}', inputs.working-directory) || inputs.working-directory }}
    env:
      PM: ${{ inputs.package-manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ inputs.sibling-repos != '' && 'app' || '.' }}
      - name: Check package manager input
        run: |
          case "$PM" in pnpm|npm) ;; *) echo "package-manager must be pnpm or npm" >&2; exit 1;; esac
      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.package-manager == 'pnpm'
        with:
          package_json_file: ${{ inputs.sibling-repos != '' && 'app/' || '' }}${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.sibling-repos != '' && 'app/' || '' }}${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Build sibling repos
        if: inputs.sibling-repos != ''
        working-directory: ${{ github.workspace }}
        env:
          SIBLINGS: ${{ inputs.sibling-repos }}
          CALLER_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # Public repos only: plain shallow clone, no token.
          for item in $SIBLINGS; do
            name="${item%%@*}"; ref=""
            [ "$name" != "$item" ] && ref="${item#*@}"
            case "$name" in ""|*[!A-Za-z0-9._-]*|.*) echo "bad sibling name: $name" >&2; exit 1;; esac
            url="https://github.com/hostryhq/${name}.git"
            if [ -z "$ref" ]; then
              if git ls-remote --exit-code --heads "$url" "$CALLER_REF" >/dev/null 2>&1; then ref="$CALLER_REF"; else ref=main; fi
            fi
            echo "sibling $name @ $ref"
            git clone --quiet --depth 1 --branch "$ref" "$url" "$name"
            (cd "$name" && if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile && pnpm run --if-present build; else npm ci && npm run --if-present build; fi)
          done
      - name: Install (frozen lockfile)
        run: |
          if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci; fi
      - name: Lint
        env:
          S: ${{ inputs.lint-script }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm run --if-present "$S"; else npm run --if-present "$S"; fi
      - name: Typecheck
        env:
          S: ${{ inputs.typecheck-script }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm run --if-present "$S"; else npm run --if-present "$S"; fi
      - name: Unit tests
        env:
          S: ${{ inputs.test-script }}
          CI: "true"
        run: |
          if [ "$PM" = pnpm ]; then pnpm run --if-present "$S"; else npm run --if-present "$S"; fi
      - name: Build
        env:
          S: ${{ inputs.build-script }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm run --if-present "$S"; else npm run --if-present "$S"; fi
