# Reusable TypeScript CI: lint, typecheck, unit tests, build.
# Scripts come from package.json and are skipped when absent (--if-present).
name: ts-ci

on:
  workflow_call:
    inputs:
      package-manager:
        description: pnpm or npm
        type: string
        default: pnpm
      node-version:
        type: string
        default: "22"
      working-directory:
        type: string
        default: .
      lint-script:
        type: string
        default: lint
      typecheck-script:
        type: string
        default: typecheck
      test-script:
        type: string
        default: test
      build-script:
        type: string
        default: build

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      PM: ${{ inputs.package-manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check package manager input
        run: |
          case "$PM" in pnpm|npm) ;; *) echo "package-manager must be pnpm or npm" >&2; exit 1;; esac
      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.package-manager == 'pnpm'
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Install (frozen lockfile)
        run: |
          if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci; fi
      - name: Lint
        env:
          S: ${{ inputs.lint-script }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm run --if-present "$S"; else npm run --if-present "$S"; fi
      - name: Typecheck
        env:
          S: ${{ inputs.typecheck-script }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm run --if-present "$S"; else npm run --if-present "$S"; fi
      - name: Unit tests
        env:
          S: ${{ inputs.test-script }}
          CI: "true"
        run: |
          if [ "$PM" = pnpm ]; then pnpm run --if-present "$S"; else npm run --if-present "$S"; fi
      - name: Build
        env:
          S: ${{ inputs.build-script }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm run --if-present "$S"; else npm run --if-present "$S"; fi
